<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Image Preview</title>
    <link rel="stylesheet" href="preview.css">
  </head>
  <body>
    <header>
      <h1>Image Preview</h1>
      <div class="toolbar">
        <button id="select-all" type="button">Select all</button>
        <button id="select-none" type="button">Select none</button>
        <button id="start-slideshow" type="button">Start slideshow</button>
        <button id="stop-slideshow" type="button" disabled>Stop slideshow</button>
        <button id="download-selected" type="button">Download selected</button>
        <button id="download-all" type="button">Download all images</button>
      </div>
      <label class="folder-label" for="preview-download-folder">Download subfolder</label>
      <input id="preview-download-folder" type="text" placeholder="optional/subfolder">
      <label class="inline-option">
        <input id="preview-write-metadata-exif" type="checkbox">
        Write metadata into JPEG EXIF when possible
      </label>
      <label class="inline-option">
        <input id="preview-download-metadata-text" type="checkbox" checked>
        Download metadata .txt sidecar files
      </label>
      <p id="summary" role="status" aria-live="polite">Loading images...</p>
    </header>

    <main id="gallery" class="gallery" aria-label="Selected image thumbnails"></main>

    <div id="lightbox" class="lightbox" hidden>
      <button id="close-lightbox" class="lightbox-close" type="button" aria-label="Close preview">×</button>
      <button id="previous-image" class="lightbox-nav previous" type="button" aria-label="Previous image">‹</button>
      <img id="lightbox-image" alt="Selected preview">
      <button id="next-image" class="lightbox-nav next" type="button" aria-label="Next image">›</button>
      <p id="lightbox-caption"></p>
    </div>

    <script src="vendor/piexif.js"></script>
    <script src="preview.js"></script>
  </body>
</html>
